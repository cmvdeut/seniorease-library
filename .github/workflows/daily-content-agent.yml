name: Daily Content Agent

on:
  schedule:
    - cron: "0 6 * * *" # 08:00 NL (CEST) — voor je naar je werk bent
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tiktok-remotion

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tiktok-remotion/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check required secrets
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BLOTATO_API_KEY: ${{ secrets.BLOTATO_API_KEY }}
          BLOTATO_SENIOREASE_TIKTOK_ID: ${{ secrets.BLOTATO_SENIOREASE_TIKTOK_ID }}
          BLOTATO_SENIOREASE_INSTAGRAM_ID: ${{ secrets.BLOTATO_SENIOREASE_INSTAGRAM_ID }}
          BLOTATO_LINKEDIN_ID: ${{ secrets.BLOTATO_LINKEDIN_ID }}
          BLOTATO_FACEBOOK_ACCOUNT_ID: ${{ secrets.BLOTATO_FACEBOOK_ACCOUNT_ID }}
          BLOTATO_FACEBOOK_PAGE_ID: ${{ secrets.BLOTATO_FACEBOOK_PAGE_ID }}
        run: |
          missing=""
          for key in ANTHROPIC_API_KEY BLOTATO_API_KEY BLOTATO_SENIOREASE_TIKTOK_ID BLOTATO_SENIOREASE_INSTAGRAM_ID BLOTATO_LINKEDIN_ID BLOTATO_FACEBOOK_ACCOUNT_ID BLOTATO_FACEBOOK_PAGE_ID; do
            if [ -z "${!key}" ]; then
              missing="$missing $key"
            fi
          done
          if [ -n "$missing" ]; then
            echo "❌ Ontbrekende GitHub Secrets:$missing"
            echo "Ga naar: Settings → Secrets and variables → Actions"
            exit 1
          fi
          echo "✅ Alle verplichte secrets aanwezig"
          echo "   ANTHROPIC_API_KEY: ${#ANTHROPIC_API_KEY} tekens"
          echo "   BLOTATO_API_KEY: ${#BLOTATO_API_KEY} tekens (moet eindigen op = als in .env)"

      - name: Run daily content pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BLOTATO_API_KEY: ${{ secrets.BLOTATO_API_KEY }}
          BLOTATO_SENIOREASE_TIKTOK_ID: ${{ secrets.BLOTATO_SENIOREASE_TIKTOK_ID }}
          BLOTATO_SENIOREASE_INSTAGRAM_ID: ${{ secrets.BLOTATO_SENIOREASE_INSTAGRAM_ID }}
          BLOTATO_LINKEDIN_ID: ${{ secrets.BLOTATO_LINKEDIN_ID }}
          BLOTATO_FACEBOOK_ACCOUNT_ID: ${{ secrets.BLOTATO_FACEBOOK_ACCOUNT_ID }}
          BLOTATO_FACEBOOK_PAGE_ID: ${{ secrets.BLOTATO_FACEBOOK_PAGE_ID }}
          DAILY_RENDER: "false"
          GMAIL_FROM: ${{ secrets.GMAIL_FROM }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_TO: ${{ secrets.GMAIL_TO }}
        run: npm run agent:daily

      - name: Commit generated content
        if: success()
        continue-on-error: true
        working-directory: ${{ github.workspace }}
        run: |
          git config user.name "SeniorEase Bot"
          git config user.email "bot@seniorease.eu"
          git add tiktok-remotion/content/daily-*.json tiktok-remotion/content/trends-*.json tiktok-remotion/content/seniorease-tiktok-scripts-en.csv
          if git diff --staged --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "Daily content agent [skip ci]"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
