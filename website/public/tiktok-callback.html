<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>TikTok OAuth � SeniorEase</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #F5EEE6 0%, #E0D5CA 100%);
            color: #1F1F1F;
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .card {
            max-width: 520px;
            width: 100%;
            background: #fff;
            border-radius: 16px;
            padding: 32px;
            box-shadow: 0 4px 24px rgba(139, 94, 60, 0.12);
            border: 1px solid #E0D5CA;
        }
        h1 {
            font-size: 22px;
            color: #8B5E3C;
            margin-bottom: 8px;
        }
        p {
            color: #555;
            margin-bottom: 20px;
            font-size: 15px;
        }
        .code-box {
            background: #F5EEE6;
            border: 1px solid #E0D5CA;
            border-radius: 10px;
            padding: 16px;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 14px;
            word-break: break-all;
            margin-bottom: 16px;
            color: #1F1F1F;
        }
        .btn {
            display: inline-block;
            background: #8B5E3C;
            color: #fff;
            border: none;
            padding: 12px 24px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn:hover { background: #6D4A30; }
        .btn:disabled { background: #aaa; cursor: not-allowed; }
        .btn.copied { background: #2d7a3e; }
        .back {
            margin-top: 24px;
            font-size: 14px;
        }
        .back a { color: #8B5E3C; text-decoration: none; font-weight: 600; }
        .back a:hover { text-decoration: underline; }
        .no-code {
            color: #888;
            font-style: italic;
        }
        .step {
            font-size: 13px;
            color: #666;
            margin-top: 12px;
            padding: 12px;
            background: #f9f9f9;
            border-radius: 8px;
        }
    </style>

    <!-- Privacy-friendly analytics by Plausible -->
        <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-61L8G6E9Q5"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-61L8G6E9Q5');
    </script>

    <!-- Vercel Web Analytics -->
    <script>
      window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
    <div class="card">
        <h1>TikTok OAuth callback</h1>
        <p>Deze pagina vangt de autorisatiecode van TikTok op. Gebruik de code hieronder om je access token op te halen.</p>

        <div id="content">
            <!-- Filled by JS -->
        </div>

        <p class="back"><a href="/">? Terug naar SeniorEase Library</a></p>
    </div>

    <script>
        (function() {
            var params = new URLSearchParams(window.location.search);
            var code = params.get('code');
            var state = params.get('state');
            var error = params.get('error');
            var container = document.getElementById('content');

            if (error) {
                container.innerHTML = '<p class="no-code">TikTok gaf een fout: <strong>' + escapeHtml(error) + '</strong>. ' +
                    (params.get('error_description') ? escapeHtml(params.get('error_description')) : '') + '</p>';
                return;
            }

            if (!code) {
                container.innerHTML = '<p class="no-code">Er staat geen code in de URL. Kom naar deze pagina via de TikTok autorisatielink (zie TIKTOK-SETUP.md).</p>';
                return;
            }

            container.innerHTML =
                '<label style="display:block; font-size:13px; color:#666; margin-bottom:6px;">Authorization code (kopieer voor de curl-commando):</label>' +
                '<div class="code-box" id="codeEl">' + escapeHtml(code) + '</div>' +
                (state ? '<p style="font-size:13px; color:#666;">State: ' + escapeHtml(state) + '</p>' : '') +
                '<button type="button" class="btn" id="copyBtn">Code kopi�ren</button>' +
                '<div class="step">Wissel deze code in voor tokens met het curl-commando uit TIKTOK-SETUP.md. Gebruik als redirect_uri <strong>exact</strong> wat je in het TikTok-dashboard hebt ingesteld (bijv. <code>https://www.seniorease.eu/tiktok-callback</code>).</div>';

            document.getElementById('copyBtn').addEventListener('click', function() {
                var btn = this;
                navigator.clipboard.writeText(code).then(function() {
                    btn.textContent = 'Gekopieerd!';
                    btn.classList.add('copied');
                    setTimeout(function() {
                        btn.textContent = 'Code kopi�ren';
                        btn.classList.remove('copied');
                    }, 2000);
                });
            });

            function escapeHtml(s) {
                if (!s) return '';
                var div = document.createElement('div');
                div.textContent = s;
                return div.innerHTML;
            }
        })();
    </script>
</body>
</html>
