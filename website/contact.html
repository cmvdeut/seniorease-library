<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - SeniorEase Library</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #f5f5f5 0%, #e8e8e8 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            max-width: 600px;
            margin: 0 auto;
            padding: 40px;
            text-align: center;
        }
        h1 {
            color: #8B4513;
            margin-bottom: 30px;
            font-size: 32px;
        }
        p {
            font-size: 18px;
            line-height: 1.7;
            color: #555;
            margin-bottom: 20px;
        }
        .contact-info {
            background: #f9f9f9;
            padding: 25px;
            border-radius: 12px;
            margin: 30px 0;
        }
        .contact-info p {
            font-size: 16px;
            color: #666;
            margin-bottom: 10px;
        }
        .back-link {
            display: inline-block;
            margin-top: 30px;
            color: #8B4513;
            text-decoration: none;
            font-size: 16px;
        }
        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Contact</h1>
        
        <p>We'd love to hear from you!</p>
        
        <div class="contact-info">
            <p><strong>Email:</strong> info@seniorease.eu</p>
            <p style="margin-top: 15px;">For questions, support, or feedback about SeniorEase Library, please send us an email.</p>
        </div>
        
        <p style="font-size: 16px; color: #666;">We aim to respond within 2-3 business days.</p>
        
        <a href="/" class="back-link">← Back to homepage</a>
    </div>
</body>
</html>
